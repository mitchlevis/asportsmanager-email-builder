name: Deploy Email Builder to Production
on:
  push:
    branches:
      - main
      - preview
      - bender-preview
jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'mitchlevis/asportsmanager-email-builder' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_POSTHOG_PUBLIC_KEY: ${{ secrets.POSTHOG_PUBLIC_KEY }}
          NUXT_PUBLIC_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'mitchlevis/asportsmanager-email-builder' && github.ref == 'refs/heads/preview'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_POSTHOG_PUBLIC_KEY: ${{ secrets.POSTHOG_PUBLIC_KEY }}
          NUXT_PUBLIC_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview

  deploy-bender-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'bender-asm/asportsmanager-email-builder' && github.ref == 'refs/heads/bender-preview'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_POSTHOG_PUBLIC_KEY: ${{ secrets.POSTHOG_PUBLIC_KEY }}
          NUXT_PUBLIC_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview-bender
